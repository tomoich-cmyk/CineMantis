<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind GT レビュー</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
<h1>Blind GT レビュー</h1>
<div id="msg" class="warn" role="alert" aria-live="assertive"></div>

<section id="start" class="box">
  <p>開始前に確認してください。</p>
  <p><label><input type="checkbox" id="att"> このセッションの前に、この review set に対する機械出力・本体アプリ上の照合結果・Jev の出力を見ていません。レビュー中も本体アプリのライブラリを開きません。</label></p>
  <p><label>reviewer id <input id="rid" maxlength="64"></label></p>
  <button id="btnStart">開始</button>
</section>

<section id="review" hidden>
  <div class="bar"><span id="prog"></span><span><button id="btnEnd">セッション終了</button></span></div>
  <div class="grid">
    <div class="box"><h2 class="h2s">手元の証拠</h2><div id="files"></div></div>
    <div class="box"><h2 class="h2s">表示された候補</h2>
      <p id="nocand" class="warn" hidden>表示された候補がありません。これは「該当なし」ではありません。TMDB で検索してください。</p>
      <div id="cands" role="radiogroup" aria-label="候補"></div></div>
  </div>
  <div class="box">
    <button id="btnConfirm" disabled>確定（選んだ候補）</button>
    <button id="btnPick" disabled>候補外を指定</button>
    <button id="btnNone" disabled>該当なし</button>
    <button id="btnDefer">保留</button>
    <select id="deferReason" aria-label="保留の理由">
      <option value="insufficient_evidence">証拠が足りない</option>
      <option value="multiple_equally_valid_targets">同等に妥当な候補が複数</option>
      <option value="candidate_ambiguity_tmdb">TMDB 側の重複・分割</option>
      <option value="need_external_lookup">外部調査が必要</option>
      <option value="other_with_note">その他（メモ必須）</option>
    </select>
    <input id="note" placeholder="メモ（任意）" maxlength="500" aria-label="メモ">
  </div>
  <div class="box"><h2 class="h2s">TMDB 検索</h2>
    <input id="q" placeholder="作品名" maxlength="200" aria-label="検索語">
    <select id="qt" aria-label="種別"><option value="movie">映画</option><option value="tv">TV</option></select>
    <button id="btnSearch">検索</button>
    <span id="searchCount" class="mut"></span>
    <div id="results"></div>
    <p>ID で指定: <input id="pid" size="10" inputmode="numeric" aria-label="TMDB ID">
      <select id="pt" aria-label="種別"><option value="movie">映画</option><option value="tv">TV</option></select>
      <button id="btnPreview">存在を確認</button></p>
    <div id="preview" class="box" hidden></div>
  </div>
</section>
<section id="done" class="box" hidden>レビューする unit はもうありません。</section>
</main>
<script src="/app.js"></script>
</body>
</html>
